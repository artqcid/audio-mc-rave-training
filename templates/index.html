<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RLTA Trainer App</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 24px; }
      .section { margin-bottom: 24px; padding: 16px; border: 1px solid #ccc; border-radius: 8px; }
      .section h2 { margin-top: 0; }
      label, input, button, select { display: block; margin: 8px 0; }
      button { padding: 8px 12px; }
      input, select { width: 100%; max-width: 400px; }
      .status { font-weight: bold; }
    </style>
  </head>
  <body>
    <h1>RLTA Trainer App</h1>
    <div class="section">
      <h2>Status</h2>
      <p>WSL läuft: <span class="status">{{ 'Ja' if wsl_running else 'Nein' }}</span></p>
      <p>CUDA verfügbar: <span class="status">{{ 'Ja' if cuda_available else 'Nein' }}</span></p>
      <p>GPU VRAM: <span class="status">{{ gpu_vram if gpu_vram else 'Unbekannt' }} MB</span></p>
    </div>
    <div class="section">
      <h2>Training</h2>
      <form action="/api/train" method="post">
        <label for="model_name">Modellname</label>
        <input id="model_name" name="model_name" value="rave_mini" />

        <label for="batch_size">Batch-Größe</label>
        <input id="batch_size" name="batch_size" type="number" value="4" min="1" />

        <label for="epochs">Epochen</label>
        <input id="epochs" name="epochs" type="number" value="3" min="1" />

        <label for="learning_rate">Learning Rate</label>
        <input id="learning_rate" name="learning_rate" type="number" step="0.0001" value="0.0002" />

        <button type="submit">Training starten</button>
      </form>
    </div>
    <div class="section">
      <h2>Preprocessing</h2>
      <form action="/api/preprocess" method="post">
        <label for="dataset_path">Dataset-Pfad</label>
        <input id="dataset_path" name="dataset_path" value="dataset" />

        <label for="target_path">Zielpfad</label>
        <input id="target_path" name="target_path" value="processed" />

        <button type="submit">Preprocessing starten</button>
      </form>
    </div>
    <div class="section">
      <h2>Export</h2>
      <form action="/api/export" method="post">
        <label for="model_path">Modellpfad</label>
        <input id="model_path" name="model_path" value="model.pt" />

        <label for="output_path">Zielpfad</label>
        <input id="output_path" name="output_path" value="exported_model.nm" />

        <button type="submit">Export starten</button>
      </form>
    </div>
  </body>
</html>
